name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version $TAG — proceeding."
          fi

      - name: Run tests
        if: steps.tag_check.outputs.exists == 'false'
        run: bun test --isolate

      - name: Build binaries
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          bun build --compile src/index.ts --target=bun-linux-x64    --outfile dist/weather-linux-x64
          bun build --compile src/index.ts --target=bun-linux-arm64   --outfile dist/weather-linux-arm64
          bun build --compile src/index.ts --target=bun-darwin-x64    --outfile dist/weather-darwin-x64
          bun build --compile src/index.ts --target=bun-darwin-arm64  --outfile dist/weather-darwin-arm64
          bun build --compile src/index.ts --target=bun-windows-x64   --outfile dist/weather-windows-x64.exe

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes